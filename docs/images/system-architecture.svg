<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">한걸음 전체 시스템 처리 구조</title>
  <desc id="desc">카메라와 센서 입력이 AI 인식, 구도 평가, 사용자 안내를 거쳐 다시 카메라 입력으로 순환하는 구조도</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315b8a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324f" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 48px 'Noto Serif KR','Malgun Gothic',serif; fill:#172230; }
      .subtitle { font: 400 23px 'Noto Serif KR','Malgun Gothic',serif; fill:#586675; }
      .step { font: 700 28px 'Noto Serif KR','Malgun Gothic',serif; fill:#17324f; }
      .item { font: 400 22px 'Noto Serif KR','Malgun Gothic',serif; fill:#33475b; }
      .tech { font: 500 19px 'Noto Serif KR','Malgun Gothic',serif; fill:#315b8a; }
      .feedback { font: 600 22px 'Noto Serif KR','Malgun Gothic',serif; fill:#315b8a; }
      .caption { font: 400 19px 'Noto Serif KR','Malgun Gothic',serif; fill:#6a7785; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="85" text-anchor="middle" class="title">한걸음 전체 시스템 처리 구조</text>
  <text x="800" y="125" text-anchor="middle" class="subtitle">Android 온디바이스 기반 실시간 인물사진 촬영 안내</text>

  <g>
    <rect x="75" y="215" width="320" height="360" rx="24" fill="#eef5fc" stroke="#9bb7d4" stroke-width="2"/>
    <rect x="475" y="215" width="320" height="360" rx="24" fill="#edf7f3" stroke="#8dbdaa" stroke-width="2"/>
    <rect x="875" y="215" width="320" height="360" rx="24" fill="#fff6e8" stroke="#dfbd7e" stroke-width="2"/>
    <rect x="1275" y="215" width="250" height="360" rx="24" fill="#f4f0fa" stroke="#b5a1d1" stroke-width="2"/>
  </g>

  <text x="235" y="270" text-anchor="middle" class="step">① 입력</text>
  <text x="110" y="330" class="item">• 카메라 프레임</text>
  <text x="110" y="375" class="item">• 회전 벡터 센서</text>
  <text x="110" y="420" class="item">• 선택 촬영 배율</text>
  <text x="235" y="520" text-anchor="middle" class="tech">CameraX · Sensor API</text>

  <text x="635" y="270" text-anchor="middle" class="step">② AI 인식</text>
  <text x="510" y="330" class="item">• 신체 관절·윤곽</text>
  <text x="510" y="375" class="item">• 주변 사람·객체</text>
  <text x="510" y="420" class="item">• 신뢰도·추적 결과</text>
  <text x="635" y="505" text-anchor="middle" class="tech">Pose Landmarker Lite</text>
  <text x="635" y="535" text-anchor="middle" class="tech">EfficientDet-Lite0 INT8</text>

  <text x="1035" y="270" text-anchor="middle" class="step">③ 구도 평가</text>
  <text x="910" y="330" class="item">• 위치·크기·여백</text>
  <text x="910" y="375" class="item">• 절단·가림·수평</text>
  <text x="910" y="420" class="item">• 점수·우선순위</text>
  <text x="1035" y="520" text-anchor="middle" class="tech">규칙 기반 가중치 평가</text>

  <text x="1400" y="270" text-anchor="middle" class="step">④ 안내</text>
  <text x="1310" y="330" class="item">• 전후·좌우 이동</text>
  <text x="1310" y="375" class="item">• 높이·기울기</text>
  <text x="1310" y="420" class="item">• 촬영 가능 표시</text>
  <text x="1400" y="520" text-anchor="middle" class="tech">UI 오버레이 · 음성/문자</text>

  <line x1="395" y1="395" x2="455" y2="395" stroke="#315b8a" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="795" y1="395" x2="855" y2="395" stroke="#315b8a" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1195" y1="395" x2="1255" y2="395" stroke="#315b8a" stroke-width="6" marker-end="url(#arrow)"/>

  <path d="M1400 595 C1400 710, 235 710, 235 595" fill="none" stroke="#315b8a" stroke-width="5" stroke-dasharray="14 11" marker-end="url(#arrow)"/>
  <text x="820" y="765" text-anchor="middle" class="feedback">사용자 이동 후 변경된 화면을 다시 분석하여 다음 안내 갱신</text>
  <text x="800" y="840" text-anchor="middle" class="caption">그림 1. 한걸음의 카메라 입력·AI 인식·구도 평가·사용자 안내 순환 구조</text>
</svg>
